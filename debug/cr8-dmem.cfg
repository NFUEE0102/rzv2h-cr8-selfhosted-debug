# OpenOCD config: debug the RZ/V2H Cortex-R8 from A55 Linux through /dev/mem.
# No probe: the CR8 debug registers sit on the system bus at 0x1F81x000.
#
# Preconditions (checked by r8ocd.sh, do not bypass):
#   * board booted with MD_BOOT3=1 (EVK DSW1-7 ON)
#   * CR8 cluster started by remoteproc, i.e. CPG_LP_CR8_CTL3 bit12 = 1;
#     otherwise any access to 0x1F8xxxxx wedges the bus (whole board hangs).
#
# AP 0 is emulated: MEM-AP transactions go straight to physical memory at
# emu_base + TAR, so -dbgbase values below are offsets from 0x1F000000.

adapter driver dmem
dmem device /dev/mem
dmem base_address 0x1F000000
dmem max_aps 1
dmem emu_ap_list 0
dmem emu_base_address_range 0x1F000000 0x01000000

# dmem is a dapdirect driver; upstream TI configs select it as "swd".
transport select swd
adapter speed 2500

source [find target/swj-dp.tcl]
set _CHIPNAME rzv2h
swj_newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

# CR8 core0 debug @ 0x1F810000  (core1 would be 0x1F812000 / -coreid 1).
# Bit 31 is the APB-AP convention OpenOCD expects; dmem strips it again.
target create $_CHIPNAME.cr8_0 cortex_r4 -dap $_CHIPNAME.dap -ap-num 0 \
    -dbgbase 0x80810000 -coreid 0

# After a CR8 cluster reset the debug registers come up with the
# memory-mapped software lock engaged (DBGLSR=3): writes from the system
# bus are silently dropped. OpenOCD never touches DBGLAR because through a
# real APB-AP that lock does not apply; through dmem it does, so OpenOCD's
# own writes (halt request, DSCR) were ignored. Unlock right after examine.
proc cr8_unlock {} {
    rzv2h.dap apreg 0 0x04 0x00810FB0
    rzv2h.dap apreg 0 0x0C 0xC5ACCE55
    # init_debug_access tried to set DSCR.HDBGen (bit 14) while locked, so
    # redo it: without HDBGen hardware breakpoints and the step
    # mismatch-breakpoint never halt the core.
    rzv2h.dap apreg 0 0x04 0x00810088
    set dscr [rzv2h.dap apreg 0 0x0C]
    rzv2h.dap apreg 0 0x04 0x00810088
    rzv2h.dap apreg 0 0x0C [expr {$dscr | 0x4000}]
}
$_CHIPNAME.cr8_0 configure -event examine-end { cr8_unlock }

# gdb "detach" must leave the firmware running (the 1 kHz loop / PWM
# outputs stop while halted); do not rely on the default detach behaviour.
$_CHIPNAME.cr8_0 configure -event gdb-detach {
    if { [rzv2h.cr8_0 curstate] eq "halted" } { resume }
}

# Never reset through OpenOCD: the cluster is owned by remoteproc.
reset_config none

bindto 127.0.0.1
gdb port 3333
telnet port 4444
tcl port disabled

init
# Mask IRQs while single-stepping, otherwise the 1 kHz tick hijacks every
# step/next into IRQ_Handler (ticks are lost during a step; fine for debugging).
rzv2h.cr8_0 cortex_r4 maskisr on
echo "cr8_0: [rzv2h.cr8_0 curstate]"
