# OpenOCD config: debug the RZ/V2H Cortex-R8 cores from A55 Linux through /dev/mem.
# No probe: the CR8 debug registers sit on the system bus at 0x1F81x000.
#
# Preconditions (checked by r8ocd.sh, do not bypass):
#   * board booted with MD_BOOT3=1 (EVK DSW1-7 ON)
#   * CR8 cluster started by remoteproc, i.e. CPG_LP_CR8_CTL3 bit12 = 1;
#     otherwise any access to 0x1F8xxxxx wedges the bus (whole board hangs).
#
# AP 0 is emulated: MEM-AP transactions go straight to physical memory at
# emu_base + TAR, so -dbgbase values below are offsets from 0x1F000000.
# Bit 31 is the APB-AP convention OpenOCD expects; dmem strips it again.
#
# Two targets, one per CR8 core:
#   rzv2h.cr8_0  debug @ 0x1F810000  gdb port 3333
#   rzv2h.cr8_1  debug @ 0x1F812000  gdb port 3334
# Both debug units are reachable as soon as the cluster is up (core1 may still be held by
# remoteproc, "offline"); halting one core does not stop the other.

adapter driver dmem
dmem device /dev/mem
dmem base_address 0x1F000000
dmem max_aps 1
dmem emu_ap_list 0
dmem emu_base_address_range 0x1F000000 0x01000000

# dmem is a dapdirect driver; upstream TI configs select it as "swd".
transport select swd
adapter speed 2500

source [find target/swj-dp.tcl]
set _CHIPNAME rzv2h
swj_newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

target create $_CHIPNAME.cr8_0 cortex_r4 -dap $_CHIPNAME.dap -ap-num 0 \
    -dbgbase 0x80810000 -coreid 0
target create $_CHIPNAME.cr8_1 cortex_r4 -dap $_CHIPNAME.dap -ap-num 0 \
    -dbgbase 0x80812000 -coreid 1

# After a CR8 cluster reset the debug registers come up with the memory-mapped software
# lock engaged (DBGLSR=3): writes from the system bus are silently dropped. OpenOCD never
# touches DBGLAR because through a real APB-AP that lock does not apply; through dmem it
# does, so OpenOCD's own writes (halt request, DSCR) were ignored. Unlock right after
# examine, and redo the DSCR.HDBGen (bit 14) write that init_debug_access lost while locked:
# without HDBGen hardware breakpoints and the step mismatch-breakpoint never halt the core.
proc cr8_unlock {dbg} {
    rzv2h.dap apreg 0 0x04 [expr {$dbg + 0xFB0}]
    rzv2h.dap apreg 0 0x0C 0xC5ACCE55
    rzv2h.dap apreg 0 0x04 [expr {$dbg + 0x088}]
    set dscr [rzv2h.dap apreg 0 0x0C]
    rzv2h.dap apreg 0 0x04 [expr {$dbg + 0x088}]
    rzv2h.dap apreg 0 0x0C [expr {$dscr | 0x4000}]
}
$_CHIPNAME.cr8_0 configure -event examine-end { cr8_unlock 0x00810000 }
$_CHIPNAME.cr8_1 configure -event examine-end { cr8_unlock 0x00812000 }

# gdb "detach" must leave the firmware running (the 1 kHz loop / PWM outputs stop while
# halted); do not rely on the default detach behaviour.
# ("resume" is a global command on the current target; "<target> resume" does not exist.)
$_CHIPNAME.cr8_0 configure -event gdb-detach {
    if { [rzv2h.cr8_0 curstate] eq "halted" } { targets rzv2h.cr8_0; resume }
}
$_CHIPNAME.cr8_1 configure -event gdb-detach {
    if { [rzv2h.cr8_1 curstate] eq "halted" } { targets rzv2h.cr8_1; resume }
}

# Never reset through OpenOCD: the cluster is owned by remoteproc.
reset_config none

bindto 127.0.0.1
gdb port 3333
telnet port 4444
tcl port disabled

init
# Mask IRQs while single-stepping, otherwise the 1 kHz tick hijacks every
# step/next into IRQ_Handler (ticks are lost during a step; fine for debugging).
rzv2h.cr8_0 cortex_r4 maskisr on
rzv2h.cr8_1 cortex_r4 maskisr on
echo "cr8_0: [rzv2h.cr8_0 curstate]   cr8_1: [rzv2h.cr8_1 curstate]"
